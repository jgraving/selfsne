name: Tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        installer: [uv, pip]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        if: matrix.installer == 'uv'
      - name: Install with uv from the lockfile
        if: matrix.installer == 'uv'
        run: |
          uv sync --frozen --python '${{ matrix.python }}' --extra dev --extra data --extra plot --extra rich
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          uv pip check
      - name: Install with pip
        if: matrix.installer == 'pip'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[dev,data,plot,rich]'
          python -m pip check
      - run: python -m pytest -q
      - run: ruff check selfsne tests examples
      - run: python examples/quickstart.py
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
        if: matrix.installer == 'pip'
      - run: uv pip install --force-reinstall --no-deps dist/*.whl
        if: matrix.installer == 'uv'
      - name: Test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -m pytest --import-mode=importlib -q "$GITHUB_WORKSPACE/tests"
  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen python examples/quickstart.py
      - run: uv run --frozen python -c "import selfsne.data, selfsne.losses, selfsne.transformers"

  portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --python 3.12 --extra dev --extra data --extra plot --extra rich
      - run: uv run --frozen --extra dev --extra data --extra plot --extra rich python -m pytest -q
      - run: uv run --frozen --extra dev --extra data --extra plot --extra rich ruff check selfsne tests examples
      - run: uv run --frozen --extra dev --extra data --extra plot --extra rich python examples/quickstart.py
