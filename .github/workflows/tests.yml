name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        installer: [uv, pip]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        if: matrix.installer == 'uv'
      - name: Install with uv from the lockfile
        if: matrix.installer == 'uv'
        run: |
          uv sync --frozen --python '${{ matrix.python }}' --extra dev --extra data --extra plot --extra rich
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          uv pip check
      - name: Install with pip
        if: matrix.installer == 'pip'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[dev,data,plot,rich]'
          python -m pip check
      - run: python -m pytest -q --junitxml=source-tests.xml
      - run: ruff check selfsne tests examples
      - run: python examples/quickstart.py
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
        if: matrix.installer == 'pip'
      - run: uv pip install --force-reinstall --no-deps dist/*.whl
        if: matrix.installer == 'uv'
      - name: Test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -m pytest --import-mode=importlib -q "$GITHUB_WORKSPACE/tests" --junitxml="$GITHUB_WORKSPACE/wheel-tests.xml"
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-${{ matrix.python }}-${{ matrix.installer }}
          path: |
            source-tests.xml
            wheel-tests.xml
          if-no-files-found: ignore
          retention-days: 7
  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen python examples/quickstart.py
      - run: uv run --frozen python -c "import selfsne.data, selfsne.losses, selfsne.transformers"

  portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --python 3.12 --extra dev --extra data --extra plot --extra rich
      - run: uv run --frozen --extra dev --extra data --extra plot --extra rich python -m pytest -q --junitxml=source-tests.xml
      - run: uv run --frozen --extra dev --extra data --extra plot --extra rich ruff check selfsne tests examples
      - run: uv run --frozen --extra dev --extra data --extra plot --extra rich python examples/quickstart.py

      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-${{ matrix.os }}
          path: |
            source-tests.xml
            wheel-tests.xml
          if-no-files-found: ignore
          retention-days: 7
  minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install minimum direct runtime dependencies
        run: |
          python -m pip install 'torch==2.4.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c constraints/minimum.txt '.[dev,data]'
          python -m pip check
      - run: python -m pytest -q --junitxml=source-tests.xml
      - run: python examples/quickstart.py
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test minimum-dependency wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: python -m pytest --import-mode=importlib -q "$GITHUB_WORKSPACE/tests" --junitxml="$GITHUB_WORKSPACE/wheel-tests.xml"
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimum-python310
          path: |
            source-tests.xml
            wheel-tests.xml
          if-no-files-found: ignore
          retention-days: 7
