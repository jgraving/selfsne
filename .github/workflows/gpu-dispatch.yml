name: Dispatch private GPU CI
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
permissions: {}
jobs:
  dispatch:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'jgraving/selfsne' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # Execute only this default-branch workflow. Never check out PR code or
      # download its artifacts in this credential-bearing hosted job.
      - name: Request private GPU validation
        env:
          DISPATCH_TOKEN: ${{ secrets.GPU_CI_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request
          run = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['workflow_run']
          if run['conclusion'] != 'success' or run['head_repository']['full_name'] != 'jgraving/selfsne':
              raise SystemExit('Source workflow is not eligible')
          if run['event'] not in ('push', 'pull_request'):
              raise SystemExit('Only source push/PR CI triggers GPU acceptance')
          if run['event'] == 'push' and run['head_branch'] != 'main':
              raise SystemExit('Only main pushes are eligible')
          sha = run['head_sha']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid source commit SHA')
          token = os.environ.get('DISPATCH_TOKEN')
          if not token:
              raise SystemExit('Configure the GPU_CI_TOKEN repository secret first')
          request = urllib.request.Request(
              'https://api.github.com/repos/jgraving/selfsne-ci/actions/workflows/gpu.yml/dispatches',
              data=json.dumps({'ref': 'main', 'inputs': {'sha': sha}}).encode(),
              headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json', 'User-Agent': 'selfsne-ci',
                       'X-GitHub-Api-Version': '2022-11-28'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 204
          print('Requested private GPU acceptance for ' + sha)
          PY
